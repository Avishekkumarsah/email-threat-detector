{% extends "base.html" %}
{% block title %}Set New Password | Email Threat Detector{% endblock %}

{% block extra_head %}
<style>
  .input-with-icon {
    position: relative;
  }
  .input-with-icon .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    color: #64748b;
    pointer-events: none;
    transition: color 0.2s;
  }
  .input-with-icon input {
    padding-left: 42px !important;
  }
  .input-with-icon input:focus + .input-icon,
  .input-with-icon input:focus ~ .input-icon {
    color: #818cf8;
  }
</style>
{% endblock %}

{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; position:relative;">

  <div style="width:100%; max-width:440px;">

    <!-- Brand Header -->
    <div style="text-align:center; margin-bottom:32px;">
      <div class="brand-shield-wrapper" aria-hidden="true">🔒</div>
      <h1 style="font-size:30px; font-weight:800; color:#ffffff; margin:0 0 8px; letter-spacing:-0.03em; background:linear-gradient(135deg,#ffffff 60%,#cbd5e1 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">
        Set New Password
      </h1>
      <p style="color:#94a3b8; font-size:14px; margin:0; font-weight:500;">
        Create a strong new password for your account
      </p>
    </div>

    <!-- Glassmorphic Card -->
    <div class="glass-auth-card">

      <form action="{{ url_for('reset_password', token=token) }}" method="post" id="reset-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Password -->
        <div style="margin-bottom:20px;">
          <label for="new-password" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#94a3b8; margin-bottom:8px;">New Password</label>
          <div class="input-with-icon">
            <span class="input-icon">🔑</span>
            <input type="password" id="new-password" name="password" required minlength="8"
                   placeholder="Minimum 8 characters"
                   style="width:100%; padding:13px 16px; background:rgba(7, 17, 31, 0.8); border:1px solid rgba(99,102,241,0.22); border-radius:12px; color:#e2e8f0; font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:all 0.2s ease; box-sizing:border-box;">
          </div>
        </div>

        <!-- Confirm Password -->
        <div style="margin-bottom:26px;">
          <label for="confirm-password" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#94a3b8; margin-bottom:8px;">Confirm Password</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirm-password" name="confirm_password" required
                   placeholder="Re-enter new password"
                   style="width:100%; padding:13px 16px; background:rgba(7, 17, 31, 0.8); border:1px solid rgba(99,102,241,0.22); border-radius:12px; color:#e2e8f0; font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:all 0.2s ease; box-sizing:border-box;">
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="reset-submit-btn"
                style="width:100%; padding:14px; background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#4f46e5 100%); border:none; border-radius:12px; color:#fff; font-size:15px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing:0.02em; box-shadow:0 8px 24px rgba(99,102,241,0.35); display:flex; align-items:center; justify-content:center; gap:8px;">
          <span>✨</span> Save New Password
        </button>
      </form>

    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelectorAll('.glass-auth-card input').forEach(el => {
    el.addEventListener('focus', () => {
      el.style.borderColor = 'rgba(99, 102, 241, 0.7)';
      el.style.boxShadow = '0 0 0 4px rgba(99, 102, 241, 0.18), 0 0 20px rgba(99, 102, 241, 0.15)';
    });
    el.addEventListener('blur', () => {
      el.style.borderColor = 'rgba(99, 102, 241, 0.22)';
      el.style.boxShadow = 'none';
    });
  });

  const btn = document.getElementById('reset-submit-btn');
  if (btn) {
    btn.addEventListener('mouseenter', () => {
      btn.style.transform = 'translateY(-2px) scale(1.01)';
      btn.style.boxShadow = '0 12px 32px rgba(99, 102, 241, 0.55)';
    });
    btn.addEventListener('mouseleave', () => {
      btn.style.transform = 'translateY(0) scale(1)';
      btn.style.boxShadow = '0 8px 24px rgba(99, 102, 241, 0.35)';
    });
  }
</script>
{% endblock %}
